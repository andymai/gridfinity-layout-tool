services:
  gridfinity-layout-tool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_LIVEBLOCKS_PUBLIC_KEY: ${VITE_LIVEBLOCKS_PUBLIC_KEY:-}
        VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY:-}
    image: gridfinity-layout-tool:local
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
