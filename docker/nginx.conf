# nginx for the self-hosted image. Mirrors vercel.json: every block or map row
# that stands in for a vercel.json entry carries "# vercel: <source>" markers on
# the lines above it, and scripts/check-docker-parity.test.ts reconciles the two
# files. Conventions that test relies on: one regex location or map row per
# line, double-quoted, no double quote inside a pattern.

# A types block replaces the table of its own level, so these extras live at
# http level where they accumulate with the stock mime.types.
types {
    application/manifest+json webmanifest;
    model/gltf-binary glb;
    model/stl stl;
    application/octet-stream tflite;
    font/ttf ttf;
}

# $uri is the final URI after try_files' internal redirect, so a content page
# matches as /guide/index.html. Applied only to 2xx/304 responses, see
# $cache_control below.
map $uri $cc_by_uri {
    # vercel: /sw.js, /manifest.webmanifest, /index.html, /storage-bridge.html
    default "public, max-age=0, must-revalidate";
    # vercel: /assets/:path*
    "~^/assets/" "public, max-age=31536000, immutable";
    # vercel: /workbox-:hash.js
    "~^/workbox-[^/]+\.js$" "public, max-age=31536000, immutable";
    # vercel: /content.:hash.css
    "~^/content\.[^/]+\.css$" "public, max-age=31536000, immutable";
    # vercel: /version.json
    "/version.json" "no-store, max-age=0";
    # vercel: /what-is-gridfinity, /guide, /privacy, /terms, /gridfinity-bin-generator,
    # vercel: /gridfinity-baseplate-generator, /gridfinity-sizes, /gridfinity-generator,
    # vercel: /gridfinity-calculator, /gridfinity-cutout-generator, /gridfinity-tool-drawer,
    # vercel: /gridfinity-kitchen-drawer, /gridfinity-software, /de/:path((?!api/).*), /pl/:path((?!api/).*),
    # vercel: /zh-CN/:path((?!api/).*), /cs/:path((?!api/).*), /ko/:path((?!api/).*), /fr/:path((?!api/).*),
    # vercel: /es/:path((?!api/).*), /pt-BR/:path((?!api/).*), /nl/:path((?!api/).*), /sv/:path((?!api/).*),
    # vercel: /nb/:path((?!api/).*), /uk/:path((?!api/).*)
    "~^/(?:(?:de|fr|es|pt-BR|nl|sv|nb|uk|pl|zh-CN|cs|ko)/)?(?:what-is-gridfinity|guide|privacy|terms|gridfinity-generator|gridfinity-bin-generator|gridfinity-baseplate-generator|gridfinity-calculator|gridfinity-sizes|gridfinity-tool-drawer|gridfinity-kitchen-drawer|gridfinity-software|gridfinity-cutout-generator)/index\.html$" "public, max-age=3600, stale-while-revalidate=86400";
}

# Headers are added with `always`, so without this a 404 under /assets/ would
# carry a year of immutable and the /api/ 503 would be cacheable.
map $status $cache_control {
    default "no-store";
    "~^(?:2\d\d|304)$" $cc_by_uri;
    "~^3" "public, max-age=0, must-revalidate";
}

map $uri $content_language {
    default "";
    # vercel: /de/:path((?!api/).*), /pl/:path((?!api/).*), /zh-CN/:path((?!api/).*), /cs/:path((?!api/).*),
    # vercel: /ko/:path((?!api/).*), /fr/:path((?!api/).*), /es/:path((?!api/).*), /pt-BR/:path((?!api/).*),
    # vercel: /nl/:path((?!api/).*), /sv/:path((?!api/).*), /nb/:path((?!api/).*), /uk/:path((?!api/).*)
    "~^/(de|fr|es|pt-BR|nl|sv|nb|uk|pl|zh-CN|cs|ko)/" $1;
}

# Only when the proxy in front says the request was HTTPS: HSTS is the
# operator's policy, not the app's. nginx skips add_header for an empty value.
map $http_x_forwarded_proto $hsts {
    default "";
    # vercel: /(.*)
    "~*^https" "max-age=63072000; includeSubDomains";
}

map $uri $storage_bridge_corp {
    default "";
    # vercel: /storage-bridge.html
    "/storage-bridge.html" "cross-origin";
}

map $uri $storage_bridge_csp {
    default "";
    # vercel: /storage-bridge.html
    "/storage-bridge.html" "frame-ancestors https://www.gridfinitylayouttool.com";
}

# Browser navigations to /api/* (the sign-in links) get a page; fetches get JSON.
map $http_accept $api_503_page {
    default /api/__503.json;
    "~*text/html" /api/__503.html;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    # The /api/ 503 has to answer a 2 MB telemetry beacon as JSON too. The
    # internal redirect to the 503 page re-runs the size check in its own
    # location, so the override cannot live in the /api/ block alone.
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/manifest+json image/svg+xml application/wasm text/xml font/ttf;

    # vercel: /(.*)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Mw22/ZAJRshXEvS8/Ol3lQ4fuh9u0CpfYpgBaSMgOsE=' 'sha256-ZFh/jA8g0pm0KqxQsSQwlMZCLY+5rjgk3lzDL9ly2KU=' https://us-assets.i.posthog.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.public.blob.vercel-storage.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.posthog.com https://*.liveblocks.io wss://*.liveblocks.io https://127.51.68.120:8181 wss://127.51.68.120:* https://fonts.googleapis.com https://fonts.gstatic.com https://*.public.blob.vercel-storage.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control always;
    add_header Content-Language $content_language always;
    add_header Cross-Origin-Resource-Policy $storage_bridge_corp always;
    add_header Content-Security-Policy $storage_bridge_csp always;

    # trailingSlash: false in vercel.json
    location ~ "^/(.+)/$" { return 308 /$1$is_args$args; }

    # vercel: /generator
    location = /generator { return 308 /gridfinity-generator$is_args$args; }
    # vercel: /generators
    location = /generators { return 308 /gridfinity-generator$is_args$args; }
    # vercel: /sizes
    location = /sizes { return 308 /gridfinity-sizes$is_args$args; }

    # No backend here: every API route answers 503 from docker/self-hosted/.
    location ^~ /api/ {
        error_page 503 $api_503_page;
        return 503;
    }
    location = /api/__503.json { internal; alias /usr/share/nginx/self-hosted/503.json; }
    location = /api/__503.html { internal; alias /usr/share/nginx/self-hosted/503.html; }

    # The healthcheck polls this every 30 s.
    location = /version.json { access_log off; }

    # Prerendered content pages. Index-first so a directory never redirects.
    # vercel: /:slug(what-is-gridfinity|guide|privacy|terms|gridfinity-generator|gridfinity-bin-generator|gridfinity-baseplate-generator|gridfinity-calculator|gridfinity-sizes|gridfinity-tool-drawer|gridfinity-kitchen-drawer|gridfinity-software|gridfinity-cutout-generator)
    location ~ "^/(?:what-is-gridfinity|guide|privacy|terms|gridfinity-generator|gridfinity-bin-generator|gridfinity-baseplate-generator|gridfinity-calculator|gridfinity-sizes|gridfinity-tool-drawer|gridfinity-kitchen-drawer|gridfinity-software|gridfinity-cutout-generator)$" { try_files $uri/index.html =404; }
    # vercel: /:locale(de|fr|es|pt-BR|nl|sv|nb|uk|pl|zh-CN|cs|ko)/:slug(what-is-gridfinity|guide|gridfinity-generator|gridfinity-bin-generator|gridfinity-baseplate-generator|gridfinity-sizes)
    location ~ "^/(?:de|fr|es|pt-BR|nl|sv|nb|uk|pl|zh-CN|cs|ko)/(?:what-is-gridfinity|guide|gridfinity-generator|gridfinity-bin-generator|gridfinity-baseplate-generator|gridfinity-sizes)$" { try_files $uri/index.html =404; }

    # SPA routes. A route with its own entry (build-route-entries.ts) serves it;
    # the rest fall back to the shell, including /community/d/:id, whose
    # server-side meta injection needs the API.
    # vercel: /designer, /baseplate, /supporters, /community, /community/d/:id([a-zA-Z0-9]{12}),
    # vercel: /s/:id([a-zA-Z0-9]{12}), /l/:id([a-zA-Z0-9]{12}), /l/:id([a-zA-Z0-9]{12})/:slug*,
    # vercel: /l/:uuid([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}),
    # vercel: /l/:uuid([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/:slug*,
    # vercel: /scan/:token([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})
    location ~ "^/(?:designer|baseplate|supporters|community|community/d/[a-zA-Z0-9]{12}|s/[a-zA-Z0-9]{12}|l/[a-zA-Z0-9]{12}(?:/.+)?|l/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(?:/.+)?|scan/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$" { try_files $uri/index.html /index.html; }

    location = / { try_files /index.html =404; }
    # Static files or 404. No catch-all: Vercel has none either, and a missing
    # chunk must not come back as the shell with a 200.
    location / { try_files $uri $uri/index.html =404; }
}
