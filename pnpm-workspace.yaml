packages:
  - 'packages/*'

# Supply-chain hardening — see SECURITY.md for rationale.
# Cooldown unit is minutes; 10080 = 7 days.
minimumReleaseAge: 10080

# Excluded: user-authored packages (no security benefit from cooldown) +
# high-trust org scopes that release lockstep (would block install for a
# week on every dep bump). The trailing entries are temporary — see TODO.
minimumReleaseAgeExclude:
  - brepjs
  - brepkit-wasm
  - occt-wasm
  - '@types/*'
  - '@typescript-eslint/*'
  - typescript-eslint
  # @typescript/native-preview (the tsgo native compiler, incl. its
  # per-platform binary packages) publishes dated dev builds daily, so a fixed
  # cooldown would perpetually block the newest one.
  - '@typescript/native-preview*'
  - '@posthog/*'
  - posthog-js
  - '@vercel/*'
  - '@protobufjs/*'
  - protobufjs
  # js-yaml 5.2.2 (2026-07-23) is the first version patched against the
  # exponential flow-collection parsing DoS (GHSA-pm4m-ph32-ghv5).
  # TODO: remove after 2026-07-30 once 5.2.2 has aged past the window.
  - js-yaml@5.2.2
  # Both versions patch the unbounded-expansion OOM (CVE-2026-14257): 5.0.8
  # (2026-07-23) on the 5.x line, and 1.1.17 (2026-07-29) backporting it to the
  # 1.x line that minimatch@3 pins. 1.1.16 shipped an EXPANSION_MAX_LENGTH
  # constant but the bound was ineffective — it still OOMs on the advisory's own
  # PoC, so the marker cannot be trusted in place of running it.
  #
  # These MUST stay one `||` union entry, not two lines: pnpm returns the first
  # rule whose package name matches and never unions across entries, so a second
  # `brace-expansion@...` line is silently dead and its version stays blocked.
  # TODO: drop 5.0.8 after 2026-07-30 and 1.1.17 after 2026-08-05, once each has
  # aged past the window; remove the entry once both are gone.
  - brace-expansion@1.1.17||5.0.8

# Blocks Shai-Hulud-class worms that spread via npm lifecycle scripts.
# Packages that need to build are listed in allowBuilds.
ignoreScripts: true

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    vite-plugin-pwa>vite: '^8.0.0'

overrides:
  '@vercel/node>undici': '^7.28.0'
  'undici@>=6.0.0 <6.27.0': '^6.27.0'
  'undici@>=7.0.0 <7.28.0': '^7.28.0'
  path-to-regexp: '6.3.0'
  '@rollup/plugin-replace>magic-string': '0.30.21'
  '@surma/rollup-plugin-off-main-thread>magic-string': '0.30.21'
  'workbox-build>@rollup/plugin-node-resolve': '^16.0.0'
  '@apideck/better-ajv-errors>ajv': '^8.17.1'
  fast-uri: '^3.1.4'
  # sharp <0.35.0 inherits libvips CVE-2026-33327/33328/35590/35591
  # (GHSA-f88m-g3jw-g9cj). Only reachable transitively via
  # manifold-3d>@gltf-transform/functions>ndarray-pixels (build-time glTF
  # texture processing, never bundled into the browser). ndarray-pixels pins
  # sharp ^0.34.0; there is no patched 0.34.x, so force the 0.35 line.
  sharp: '^0.35.0'
  serialize-javascript: '^7.0.3'
  'eslint-plugin-react-hooks>eslint': '^10.0.3'
  'eslint-plugin-jsx-a11y>eslint': '^10.0.3'
  # All minimatch consumers are pinned to the 10.x line, the only line pulling a
  # brace-expansion that is patched against GHSA-mh99-v99m-4gvg (fixed only in
  # 5.0.8 — every earlier major, incl. the 1.x/2.x/3.x/4.x lines, is affected
  # with no backport). filelist reaches minimatch only through the named
  # `minimatch.match(...)`, so it never needed the default export.
  #
  # jsx-a11y and @ts-morph/common historically blocked this: both called
  # minimatch's *default* export, which minimatch@10's CJS build does not define
  # (it exports named `{ minimatch }` and sets __esModule with no `default`), so
  # both threw `is not a function` at runtime — keeping minimatch@3 and the
  # unpatchable brace-expansion@1.x in the tree. Both are now patched to import
  # the named export (patches/), the same change upstream would make, so they
  # move to 10.x too and brace-expansion@1.x leaves the tree entirely (#2974).
  'eslint-plugin-jsx-a11y>minimatch': '^10.2.5'
  '@ts-morph/common>minimatch': '^10.2.5'
  'filelist>minimatch': '^10.2.5'
  '@vercel/build-utils>minimatch': '^10.2.3'
  '@vercel/python-analysis>minimatch': '^10.2.3'
  '@vercel/static-config>ajv': '^8.18.0'
  'glob>minimatch': '^10.2.3'
  flatted: '^3.4.2'
  dompurify: '^3.4.11'
  '@babel/core@<7.29.6': '^7.29.6'
  'js-yaml@<4.2.0': '^4.2.0'
  protobufjs: '^7.6.4'
  'eslint-plugin-i18next>lodash': '^4.18.1'
  'vitest-axe>lodash-es': '^4.18.1'
  'picomatch@>=4.0.0 <4.0.4': '^4.0.4'
  # brace-expansion arrives only via minimatch@10 now (all consumers pinned to
  # 10.x above), which uses the 5.x line. Force any 5.0.x below 5.0.8 up to the
  # release patched against GHSA-mh99-v99m-4gvg. The 1.x line is gone, so its old
  # `brace-expansion@<1.1.17` pin is no longer needed (#2974).
  'brace-expansion@>=5.0.0 <5.0.8': '^5.0.8'
  'tar@<7.5.21': '^7.5.21'
  '@vercel/python-analysis>smol-toml': '^1.6.1'
  esbuild: '0.28.1'

patchedDependencies:
  '@ts-morph/common@0.11.1': patches/@ts-morph__common@0.11.1.patch
  brepjs@18.119.2: patches/brepjs@18.119.2.patch
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
