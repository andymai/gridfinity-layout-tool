name: CI

on:
  push:
    branches:
      - main
  # No `branches:` filter on pull_request. That filter matches the BASE branch,
  # so a PR stacked on another PR's branch drew no Build, test, quality or OSV
  # run at all -- and reported green, because a rollup over zero jobs is green.
  # The checks that did appear on such a PR were exactly the ones without this
  # filter (pr-title, Vercel, the review bots), which is what made it look like
  # CI had run.
  #
  # Push stays pinned to main: branches are gated as pull requests, and a bare
  # branch push should not spend a full suite.
  pull_request:

permissions:
  contents: read

# A PR shares one group across its pushes and cancels the superseded run: once
# the branch moves, the older result is worthless. Main gets a group PER COMMIT
# instead, so a push there can never cancel the one before it. Every commit on
# main is a release candidate and its run is the only full-suite signal that
# commit will ever get, so cancelling threw away the answer rather than an
# obsolete one.
#
# Cancelling on main was near-total, not occasional: release-please pushes its
# release commit within a minute of the merge that triggered it, and the main
# suite takes ~30 minutes, so almost every run was killed by the next push. The
# tell is `Unit Tests Complete: failure` under an otherwise all-`cancelled` run
# — the gate is `if: always()`, so it outlives its own cancelled dependencies and
# then fails them for not being `success`. Main read as red because nothing had
# finished, which looks identical to a real failure at a glance.
#
# Per-commit groups rather than one queue: main runs are independent, and
# serialising them would put each behind ~30 minutes of backlog during a burst of
# merges. Only `github.sha`/`ref`/`event_name` appear here, all trusted — gating
# on the commit MESSAGE would be attacker-influenceable, since a PR title becomes
# the squash commit subject.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'other' }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  # PRs + main: Build and bundle size check
  build:
    name: Build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm run size:check

  # PRs: Split into two test groups for fast, balanced feedback (9 runners).
  #   Vitest shards by hashing the file path, not by duration, so the heavy
  #   brepjs/OpenCascade WASM generator tests (their own `generators` project)
  #   would otherwise cluster onto one shard and dominate wall time. Running
  #   them on dedicated shards decouples that bottleneck from hash luck.
  #
  #   Generators get 6 shards, core 3. The asymmetry is the point: generators
  #   carry ~3700s of WASM test CPU against core's few hundred, and a shard is
  #   bounded below by BOTH its longest single file and its own CPU ÷ workers
  #   (4 on a standard runner). Until #2882 the first bound dominated — one
  #   14-minute export file that no amount of sharding could divide, since
  #   `--shard` splits by file path and Vitest never parallelizes within a file.
  #   With that file split per domain the generators group became CPU-bound
  #   instead (767s wall against a ~330s longest file), which is the regime where
  #   adding shards actually buys wall time. Past ~6 the per-shard fixed cost
  #   (checkout + install + WASM init) starts eating the gain.
  # Main: Full test suite (all projects) with coverage thresholds, single runner.
  test:
    name: Unit Tests (${{ matrix.name }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three cases, in order:
        #   1. Not a PR (i.e. main): full suite with coverage, one runner.
        #   2. PR with self-hosted generators eligible: core shards only, because
        #      `test-selfhosted` is covering generators on the Mac mini.
        #   3. PR otherwise: all nine, the pre-cut-over layout.
        #
        # Case 3 is the fallback, and its condition must stay the negation of
        # `test-selfhosted`'s `if` for every PR that reaches this job. If the two
        # ever disagree, a PR matching neither runs no generator tests at all and
        # still reports green — the failure mode is silence, not a red check. That
        # is why the head-repo comparison is duplicated here rather than simplified
        # away: a fork PR is barred from the hardware, so it has to keep the cloud
        # shards.
        #
        # `test-selfhosted` also carries a release-please guard that is deliberately
        # absent here: this job's own `if` already skips those PRs outright, so
        # repeating it inside the matrix would be unreachable.
        #
        # Core shards are wide where the self-hosted generators pool is narrow.
        # These are independent cloud runners, so a shard costs only its own
        # setup; the mini's runners all share one host, which is why widening
        # helps here and hurts there.
        include: >-
          ${{ github.event_name != 'pull_request'
          && fromJSON('[{"name":"full 1/8","group":"full","shard":"1/8","idx":"1"},{"name":"full 2/8","group":"full","shard":"2/8","idx":"2"},{"name":"full 3/8","group":"full","shard":"3/8","idx":"3"},{"name":"full 4/8","group":"full","shard":"4/8","idx":"4"},{"name":"full 5/8","group":"full","shard":"5/8","idx":"5"},{"name":"full 6/8","group":"full","shard":"6/8","idx":"6"},{"name":"full 7/8","group":"full","shard":"7/8","idx":"7"},{"name":"full 8/8","group":"full","shard":"8/8","idx":"8"}]')
          || (vars.SELF_HOSTED_CI == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON('[{"name":"core 1/6","group":"core","shard":"1/6"},{"name":"core 2/6","group":"core","shard":"2/6"},{"name":"core 3/6","group":"core","shard":"3/6"},{"name":"core 4/6","group":"core","shard":"4/6"},{"name":"core 5/6","group":"core","shard":"5/6"},{"name":"core 6/6","group":"core","shard":"6/6"}]')
          || fromJSON('[{"name":"generators 1/6","group":"generators","shard":"1/6"},{"name":"generators 2/6","group":"generators","shard":"2/6"},{"name":"generators 3/6","group":"generators","shard":"3/6"},{"name":"generators 4/6","group":"generators","shard":"4/6"},{"name":"generators 5/6","group":"generators","shard":"5/6"},{"name":"generators 6/6","group":"generators","shard":"6/6"},{"name":"core 1/6","group":"core","shard":"1/6"},{"name":"core 2/6","group":"core","shard":"2/6"},{"name":"core 3/6","group":"core","shard":"3/6"},{"name":"core 4/6","group":"core","shard":"4/6"},{"name":"core 5/6","group":"core","shard":"5/6"},{"name":"core 6/6","group":"core","shard":"6/6"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate artifacts
        # en.json is generated from en.ts at build/dev time and gitignored.
        # Tests import it via lazy-loading, so it must exist before vitest runs.
        run: pnpm run build:en-locale

      - name: Run tests
        env:
          GIT_REF: ${{ github.ref }}
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
        # No `-u` here, deliberately: it makes Vitest REWRITE a mismatched
        # snapshot in the runner and pass, so committed baselines gate nothing
        # (#3181). It was correct when added — 3d1fccb7 had just deleted the
        # scenario snapshots from git, so every missing baseline failed a shard
        # — but e8653992 restored them to version control in June. Baselines are
        # now committed, so CI asserts them. Regenerate locally and commit the
        # diff: `pnpm exec vitest run <path> -u` — keep the filter BEFORE `-u`,
        # since a bare `-u` consumes the next token as its value and would run
        # the whole suite. See scenarioRunner.ts for the full CLI note.
        run: |
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            # Projects are named explicitly rather than using the default "all":
            # `integration` needs a Redis service and runs as its own job.
            # `generators-heavy` runs nowhere else, so dropping it here retires
            # those files silently. Guarded by src/test/ciProjectCoverage.test.ts.
            # --reporter=blob writes a machine-readable result per shard, which
            # `Coverage Merge` recombines. The thresholds are zeroed here and
            # enforced only there: a shard covers a fraction of the files, so
            # checking the global thresholds against it fails every shard.
            echo "Running full suite with coverage (main branch, shard $SHARD)"
            pnpm vitest run --coverage --reporter=blob --shard="$SHARD" --coverage.thresholds.lines 0 --coverage.thresholds.functions 0 --coverage.thresholds.branches 0 --coverage.thresholds.statements 0 --project=unit --project=dom --project=generators --project=generators-heavy
          elif [ "$GROUP" = "generators" ]; then
            echo "Running generators project (shard $SHARD)"
            pnpm vitest run --project=generators --shard="$SHARD"
          else
            echo "Running core projects unit+dom (shard $SHARD)"
            pnpm vitest run --project=unit --project=dom --shard="$SHARD"
          fi

      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          name: blob-${{ matrix.idx }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && github.ref == 'refs/heads/main'
        with:
          name: coverage-report-${{ matrix.idx }}
          path: coverage/
          retention-days: 5

  # The generators workload, on the self-hosted Mac mini (M4 Pro, 10 performance
  # cores). This REPLACES the cloud generators shards on same-repo PRs; the matrix
  # above drops to core-only when this job is eligible.
  #
  # Measured against the cloud shards on the same commits: 450s -> 224s before the
  # kumiko files were split (#3223), 331s -> 196s after. Snapshot parity with the
  # x64 baselines was confirmed across two runs before cutting over — the WASM
  # occt-wasm kernel tessellates identically on arm64.
  #
  # PRs only. Pushes to main keep the full cloud suite with coverage, so releases
  # never depend on the mini being up.
  #
  # Two shards, not six. The 6-way split above is sized for six independent
  # 4-core cloud runners; on one machine that split would pay checkout + install
  # + WASM init six times over and leave each shard ~1.7 cores. Two shards at
  # five workers each keeps the performance cores saturated while leaving the
  # efficiency cores for interactive use and for halcyon's three runners, which
  # share this host.
  #
  # THE INVARIANT: `gflt-ci runners x maxWorkers <= 10 performance cores`. Every
  # runner in the pool is a process on this one mini, so a shard scheduled
  # anywhere lands here and the host's worst case is that product, NOT one run's
  # matrix. The pool is deliberately two for this reason. It was briefly four,
  # which left 2x5 correct only for a lone PR: a second one in flight made it
  # twenty workers on ten cores, and #3537 is the shape that takes, a per-test
  # timeout firing on a different test each attempt.
  #
  # Registering a third runner silently breaks that product and reopens #3537.
  # Re-derive it before changing either side, and note that the fix is NOT more
  # shards: `--shard` splits the file set, so it shortens a job without making
  # any single test faster, and raising the count to match a bigger pool only
  # multiplies the workers on the host. That was measured, not assumed, on
  # 4x3 (run 31960552340): the slowest shard went 250s -> 355s, because four
  # concurrent `pnpm install`s contend on one disk (16-49s -> a uniform ~68s)
  # and hash sharding balances worse at 4-way than 2-way (1.05x -> 1.45x
  # spread). A smaller pool is both faster per PR and bounded; two queued PRs
  # finish in ~500s against ~710s for the same work split four ways.
  #
  # `vars.SELF_HOSTED_CI` is the kill switch: unset it in repo settings and every
  # shard here stops scheduling immediately, no code change needed. The head_repo
  # comparison is the security boundary — a fork PR must never execute on
  # self-hosted hardware, where it would run as a real user on a real machine
  # with a persistent workspace.
  test-selfhosted:
    name: Unit Tests SH (${{ matrix.name }})
    if: >-
      ${{ vars.SELF_HOSTED_CI == 'true'
      && !startsWith(github.head_ref, 'release-please--')
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, gflt-ci]
    # A wedged WASM kernel would otherwise hold a runner indefinitely, and the
    # pool is two, so every PR behind it waits on the one that is left.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: generators 1/2
            shard: 1/2
          - name: generators 2/2
            shard: 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate artifacts
        run: pnpm run build:en-locale

      - name: Run generators tests
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm vitest run --project=generators --shard="$SHARD" --maxWorkers=5

  # Tests that need a real Redis. The rate limiter runs as a Lua script, and a
  # mocked ioredis can only assert the command was issued — it cannot execute
  # the body, so enforcement and atomicity are unverifiable without a server.
  # One container here rather than a service on all nine Unit Tests shards.
  integration:
    name: Integration Tests
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate artifacts
        run: pnpm run build:en-locale

      - name: Run integration tests
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: pnpm vitest run --project=integration

  # Single stable gate that passes only if every Unit Tests shard passed.
  # Branch protection requires this one context instead of the individual
  # shard names, so shard/group counts can change without updating the ruleset.
  # always() so it still runs (and fails) when a shard fails; skipped for
  # release-please PRs in lockstep with the test job above.
  # Main only. A shard's coverage covers just the files it ran, so the
  # thresholds cannot be checked on any single one; this recombines the blob
  # reports and is the only place they are enforced.
  test-merge:
    name: Coverage Merge
    needs: [test]
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate artifacts
        run: pnpm run build:en-locale

      - name: Download blob reports
        # Third-party action — pinned to commit SHA (Dependabot will keep it current).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge reports and enforce coverage thresholds
        run: pnpm vitest --mergeReports --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  test-gate:
    name: Unit Tests Complete
    needs: [test, integration, test-selfhosted, test-merge]
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all unit-test shards passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SELFHOSTED_RESULT: ${{ needs.test-selfhosted.result }}
          MERGE_RESULT: ${{ needs.test-merge.result }}
          REF: ${{ github.ref }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Unit test shards did not all pass (result: $TEST_RESULT)"
            exit 1
          fi
          # Folded in here so branch protection keeps requiring one context.
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "Integration tests did not pass (result: $INTEGRATION_RESULT)"
            exit 1
          fi
          # `skipped` is legitimate and means the cloud matrix above ran the
          # generators shards instead: kill switch off, a fork PR, or a push to
          # main. It is NOT a silent pass — the two conditions are written as
          # exact negations of each other, so whichever path is skipped, the other
          # one ran. Any other non-success state is a real failure.
          # Coverage thresholds live only in the merge job, so on main a
          # `skipped` here would drop them without failing anything. On a PR it
          # is the correct state: the job does not run outside main.
          if [ "$REF" = "refs/heads/main" ]; then
            if [ "$MERGE_RESULT" != "success" ]; then
              echo "Coverage merge did not pass (result: $MERGE_RESULT)"
              exit 1
            fi
          else
            case "$MERGE_RESULT" in
              skipped|success) ;;
              *)
                echo "Coverage merge in an unexpected state for a PR (result: $MERGE_RESULT)"
                exit 1
                ;;
            esac
          fi

          case "$SELFHOSTED_RESULT" in
            success|skipped) ;;
            *)
              echo "Self-hosted generator shards did not pass (result: $SELFHOSTED_RESULT)"
              echo "If the Mac mini is down, set the SELF_HOSTED_CI repo variable to"
              echo "false (or unset it) to fall back to cloud generator shards."
              exit 1
              ;;
          esac
          echo "All unit-test shards and integration tests passed."

  # PRs + main: Lint, i18n, module boundaries, union exhaustiveness
  # All checks run to completion so every failure is visible in one pass
  quality:
    name: Quality
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      # setup-pnpm caches the pnpm store, not this directory, so without this the
      # ESLint cache is cold every run. `--cache-strategy content` in the lint
      # script is load-bearing too: a fresh checkout rewrites every mtime, so the
      # default metadata strategy would discard a restored cache.
      #
      # eslint-rules/ is in the key because ESLint caches results, not the rules
      # that produced them, so a rule edited against a warm cache reports a stale
      # pass.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'eslint-rules/**', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'eslint-rules/**', 'pnpm-lock.yaml') }}-

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Check formatting
        id: format
        continue-on-error: true
        # Prettier runs on staged files at commit time, so anything reaching the
        # branch another way (a generator, a merge resolution) drifts unseen.
        run: pnpm run format:check

      - name: Check i18n keys
        id: i18n_keys
        continue-on-error: true
        run: pnpm run check:i18n

      - name: Check i18n values
        id: i18n_values
        continue-on-error: true
        run: pnpm run check:i18n:values

      - name: Check i18n interpolation
        id: i18n_interpolation
        continue-on-error: true
        run: pnpm run check:i18n:interpolation

      - name: Check i18n unused keys
        id: i18n_unused
        # Full-codebase scan: only run when i18n source files changed, same as pre-commit gate.
        # This avoids blocking unrelated PRs while in-progress i18n work is uncommitted on main.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            base=""  # initial push — no prior commit; run unconditionally
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^src/i18n/'; then
            pnpm run check:i18n:unused
          else
            echo "ℹ️  No i18n files changed — skipping unused key scan"
          fi

      - name: Check module boundaries
        id: boundaries
        continue-on-error: true
        run: pnpm run check:boundaries

      - name: Check union exhaustiveness
        id: exhaustiveness
        continue-on-error: true
        # No '--' separator: pnpm forwards it literally and the script then
        # checks a single nonexistent path instead of all 2,382 source files.
        run: pnpm run check:exhaustiveness --all

      - name: Check doc drift
        id: doc_drift
        continue-on-error: true
        # CI never rewrites the baseline (the script guards on $CI); a doc that
        # shrank simply sits under budget until a local run ratchets it down.
        run: pnpm run check:doc-drift

      - name: Fail if any check failed or was skipped
        # 'skipped' means a prior non-continue-on-error step (e.g. pnpm install) failed,
        # causing all downstream steps to be skipped. Treat skipped == failure here
        # so the job doesn't pass vacuously when dependency installation breaks.
        if: always()
        run: |
          failed=0
          check_step() {
            local name="$1" outcome="$2"
            if [ "$outcome" = "failure" ] || [ "$outcome" = "skipped" ]; then
              echo "  ✗ $name ($outcome)"
              failed=1
            fi
          }
          check_step "lint"                "${{ steps.lint.outcome }}"
          check_step "formatting"          "${{ steps.format.outcome }}"
          check_step "i18n keys"           "${{ steps.i18n_keys.outcome }}"
          check_step "i18n values"         "${{ steps.i18n_values.outcome }}"
          check_step "i18n interpolation"  "${{ steps.i18n_interpolation.outcome }}"
          check_step "i18n unused keys"    "${{ steps.i18n_unused.outcome }}"
          check_step "doc drift"           "${{ steps.doc_drift.outcome }}"
          check_step "module boundaries"   "${{ steps.boundaries.outcome }}"
          check_step "union exhaustiveness" "${{ steps.exhaustiveness.outcome }}"
          if [ "$failed" = "1" ]; then
            echo "One or more quality checks failed or were skipped."
            exit 1
          fi
          echo "All quality checks passed."
