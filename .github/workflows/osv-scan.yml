name: OSV Scan

# Complements the pnpm minimumReleaseAge cooldown: cooldown blocks
# fresh-but-untrusted, OSV blocks old-but-known-bad.
# PRs are report-only (transitive deps can't always be updated atomically with
# a feature PR); main + weekly schedule fail closed so the dashboard stays loud.

on:
  # Unfiltered by base branch so a PR stacked on another PR is scanned too --
  # see ci.yml for why the `branches:` filter silently exempted those.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# Per-commit group on push, so the BLOCKING main scan is never cancelled by the
# next push; PRs keep sharing a group and cancelling superseded runs. A cancelled
# blocking scan is the worst case here: it reports neither pass nor fail, so a
# lockfile regression on main could land with no scan ever completing on it. See
# ci.yml for the full rationale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'other' }}
  cancel-in-progress: true

jobs:
  scan-pr:
    name: OSV Scan (report-only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    name: OSV Scan (blocking)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
    permissions:
      actions: read
      contents: read
      security-events: write
