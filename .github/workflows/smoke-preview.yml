name: Smoke (Preview)

# Runs the PWA smoke spec against a PR's Vercel preview deployment.
# Catches deploy-time bugs (broken precache, missing assets, wwwMigration-class
# hash mismatches) before merge.
#
# Previews are OPT-IN (see scripts/vercel-ignore.sh) — branch as `preview/<name>`
# or put `[preview]` in the head commit message. Without a preview there is
# nothing to smoke against and this workflow exits success with a warning, so
# it only provides real coverage on PRs that requested one. Opt in for anything
# touching the service worker, build output, or public/ assets.
#
# Because it passes vacuously without a preview, this is NOT a useful required
# status check on its own — a green run may mean "nothing was tested".

on:
  # Unfiltered by base branch so a stacked PR that opted into a preview is
  # smoked too -- see ci.yml. paths-ignore stays; only the base filter goes.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/CODEOWNERS'

permissions:
  contents: read
  pull-requests: read
  deployments: read
  statuses: read

concurrency:
  group: smoke-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  smoke:
    name: PWA Smoke Test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Fork PRs and Dependabot runs execute without access to repo Actions
      # secrets, so VERCEL_AUTOMATION_BYPASS_SECRET is empty and the protected
      # preview redirects to SSO — the smoke spec can never reach it. Detect
      # both and short-circuit cleanly; these PRs still get coverage from Build,
      # Unit Tests, Quality, and CodeQL, plus the post-promote production smoke.
      NO_SECRETS: ${{ github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip — no secret access (fork or Dependabot PR)
        if: env.NO_SECRETS == 'true'
        run: |
          echo "::warning::Fork or Dependabot PR — VERCEL_AUTOMATION_BYPASS_SECRET unavailable; preview smoke is N/A."
          echo "Coverage for this PR comes from CI Build, Unit Tests, Quality, and CodeQL."

      - name: Resolve Vercel preview URL
        id: preview
        if: env.NO_SECRETS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Poll GitHub deployments API for up to 5 min looking for a successful
          # Vercel preview matching this PR's head SHA. We can't use the third-party
          # wait-for-vercel-preview action because (a) it pins to a tag and (b) it
          # fails hard when Vercel's ignore step legitimately skips a deploy.
          deadline=$(( $(date +%s) + 300 ))
          url=""
          ignored=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # First: any deployment for this SHA?
            deployment_id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$HEAD_SHA&per_page=20" \
              --jq '[.[] | select(.environment != "Production")] | .[0].id // empty')

            if [ -n "$deployment_id" ]; then
              status_json=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=10")
              state=$(echo "$status_json" | jq -r '.[0].state // ""')
              candidate=$(echo "$status_json" | jq -r '.[0].environment_url // ""')
              if [ "$state" = "success" ] && [[ "$candidate" == *.vercel.app* ]]; then
                url="$candidate"
                break
              fi
            fi

            # Detect the Vercel "ignored build" case. When Vercel skips a deploy
            # it does not create a GitHub deployment at all; it posts the signal
            # as a commit status (context=Vercel, description="Canceled by
            # Ignored Build Step"). Older Vercel versions also posted a PR
            # comment, so we keep that as a fallback.
            if gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=20" \
                --jq '.[] | select(.context == "Vercel") | .description' \
                | grep -qE 'Ignored Build Step|Skipped Deployment'; then
              ignored=1
              break
            fi
            if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --jq '.[].body' \
                | grep -qE 'Skipped Deployment|Ignored Build Step'; then
              ignored=1
              break
            fi

            sleep 10
          done

          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "status=ready" >> "$GITHUB_OUTPUT"
            echo "Resolved preview URL: $url"
          elif [ -n "$ignored" ]; then
            echo "status=ignored" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel build was ignored for this PR — no preview to smoke against."
          else
            echo "status=timeout" >> "$GITHUB_OUTPUT"
            echo "::error::Timed out waiting for Vercel preview after 5 min."
            exit 1
          fi

      - name: Skip — no preview deployed
        if: steps.preview.outputs.status == 'ignored'
        run: |
          echo "Vercel ignored this build (likely a CI/infra-only PR). Smoke is N/A."
          echo "If this PR DOES touch SPA code, check scripts/vercel-ignore.sh."

      - name: Install pnpm
        if: steps.preview.outputs.status == 'ready'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        if: steps.preview.outputs.status == 'ready'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.preview.outputs.status == 'ready'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.preview.outputs.status == 'ready'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke spec against preview
        if: steps.preview.outputs.status == 'ready'
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.preview.outputs.url }}
          # Required when Vercel deployment protection is enabled (it is by default
          # for paid plans). Generate via Vercel project Settings → Deployment
          # Protection → Protection Bypass for Automation.
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: '1'
        run: pnpm exec playwright test --config=playwright.smoke.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-preview-trace
          path: test-results/
          retention-days: 7
