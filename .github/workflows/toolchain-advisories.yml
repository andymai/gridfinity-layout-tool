name: Toolchain Advisories

# osv-scan.yml reads only pnpm-lock.yaml. This covers the pins around it: the
# pnpm in packageManager, the Dockerfile's corepack and base images, and the
# SHA-pinned actions. Same split as osv-scan.yml: PRs report only, main and the
# weekly schedule fail closed. The schedule is what catches a new advisory
# against a pin nobody touched.

on:
  pull_request:
    paths:
      - package.json
      - Dockerfile
      - '.github/**'
      - 'scripts/check-toolchain-advisories*.ts'
  push:
    branches: [main]
    paths:
      - package.json
      - Dockerfile
      - '.github/**'
      - 'scripts/check-toolchain-advisories*.ts'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'other' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Toolchain advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Check toolchain pins against OSV and Node's advisories
        run: node scripts/check-toolchain-advisories.ts ${{ github.event_name == 'pull_request' && '--report-only' || '' }}
