name: Release
# Scheduled, not per-push: each release merge is also the production deploy
# trigger (scripts/vercel-ignore.sh). Three a day keeps a release a readable
# unit for the CHANGELOG and for What's New, which per-merge releases would
# reduce to one trivial item each.
#
# This is NOT a user-protection measure. A deploy does not interrupt anyone
# using the app: the service worker registers with skipWaiting and clientsClaim
# both false, so a live tab keeps its bundle until `usePWAUpdate` offers the
# update on its own hourly check, and Vercel Skew Protection pins a client
# mid-session to the deployment it loaded. The hours are activity troughs as a
# tiebreaker only (06:00 UTC is the daily minimum, 13:00 the last dip before
# the ramp into the 16:00-21:00 peak plateau, 23:00 the descent), and the
# choice is insensitive: they land within 2% of the best available triple in
# either DST offset, so a DST boundary needs no revisit.
on:
  schedule:
    - cron: '0 6,13,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Deliberately the OPPOSITE of ci.yml's per-commit groups. Two release-please
# runs against the same branch would race on the same release PR and the same
# tag, so these must stay mutually exclusive: one shared group, and they QUEUE.
#
# `cancel-in-progress: false` because the job below is a stateful sequence, not
# an idempotent check. release-please creates or updates the release PR, and only
# then does a separate step approve it and a third enable auto-merge — the last
# one looping up to six times with 10s sleeps while the PR's required checks
# register. A cancel anywhere after the first step leaves the release PR created
# but never approved and never set to auto-merge, which is exactly the "release
# PR sits open, no versions ship" stall in the release-and-ci skill. A manual
# workflow_dispatch can land inside a scheduled run's ~50s retry window, so the
# overlap risk remains even without per-push triggering.
#
# Queueing is affordable here in a way it would not be in ci.yml: this run takes
# about a minute, so the queue drains as fast as merges arrive. Sequential runs
# are also the intended usage — each one reconciles the release PR against
# current main, so the last to run produces the correct result.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Third-party action — pinned to commit SHA (Dependabot will keep it current).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # Marks the release on PostHog charts so a metric change can be read
      # against the deploy that shipped it. Best-effort by design: a missing
      # key or a PostHog outage must never block the release pipeline, so the
      # step skips without the secret and warns instead of failing.
      - name: Annotate release in PostHog
        if: steps.release.outputs.releases_created == 'true'
        env:
          POSTHOG_ANNOTATION_API_KEY: ${{ secrets.POSTHOG_ANNOTATION_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$POSTHOG_ANNOTATION_API_KEY" ]; then
            echo "POSTHOG_ANNOTATION_API_KEY not set; skipping release annotation."
            exit 0
          fi
          curl --silent --show-error --fail-with-body --max-time 30 \
            -H "Authorization: Bearer $POSTHOG_ANNOTATION_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"v$VERSION\", \"date_marker\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"scope\": \"project\", \"creation_type\": \"GIT\"}" \
            "https://us.posthog.com/api/projects/284234/annotations/" \
            || echo "::warning::PostHog release annotation failed (non-blocking)."

      - name: Auto-approve Release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ fromJSON(steps.release.outputs.pr).number }} \
            --approve --repo ${{ github.repository }}

      - name: Auto-merge Release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Guard fromJSON: when no release PR is created the output is empty and
          # fromJSON('') errors at template-eval time even though `if:` skips the step.
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
        # `gh pr merge --auto` enables auto-merge, but GitHub rejects the call
        # (`Pull request is in unstable status`) in the brief window before the PR's
        # required checks register. Retry until they settle so the release isn't
        # left un-merged by a startup race.
        run: |
          for attempt in $(seq 1 6); do
            if gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"; then
              echo "Auto-merge enabled on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Attempt $attempt failed to enable auto-merge; retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::Failed to enable auto-merge on PR #$PR_NUMBER after 6 attempts."
          exit 1
